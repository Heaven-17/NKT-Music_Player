<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#24170d 0%,#3b2816 25%,#121212 70%,#090909 100%);color:#f0d7a2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Helvetica,Arial,sans-serif}

a.b{display:block;padding:12px;margin:12px 0;border-radius:999px;text-align:center;text-decoration:none;cursor:pointer;color:#ffe0aa;letter-spacing:1px;background:linear-gradient(145deg,#5d3d20,#1a120c);border:1px solid rgba(224,184,109,.35);box-shadow:inset 0 1px 2px rgba(255,255,255,.06),0 4px 10px rgba(0,0,0,.5);transition:transform .2s ease,box-shadow .2s ease}

a.b:active{transform:scale(.96)}
